# Recolha das métricas do central durante os testes de carga (ADR-0004).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: monitor-central
    # Uma série por instância (SC3: --scale backend=N).
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 9464
        refresh_interval: 5s
