# Copiar para a raiz de cada repositório e substituir <organizacao> e <repo>.
# A chave do projeto e a organização vêm do SonarQube Cloud depois de importar o repo.
sonar.organization=<organizacao>
sonar.projectKey=<organizacao>_<repo>

sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**,**/vendor/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Produzidos pelo workflow go-ci.yml do monitor-platform.
sonar.go.coverage.reportPaths=coverage.out,coverage-integration.out
sonar.go.golangci-lint.reportPaths=golangci-report.xml
