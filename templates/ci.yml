# Copiar para <repo>/.github/workflows/ci.yml em cada repositório Go do Monitor.
# Toda a lógica vive em monitor-platform; aqui só se escolhem as opções do repo.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  go:
    uses: ads-iscte-rg-ja/monitor-platform/.github/workflows/go-ci.yml@v1
    with:
      # Só no monitor-central; nos outros repos apagar esta linha.
      integration-packages: ./internal/integration
      # false durante a medição de baseline (iteração 0); true depois.
      lint-blocking: false
    secrets: inherit
