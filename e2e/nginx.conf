# Balanceador do E2E: a configuração do central (monitor-central/deployments/nginx/nginx.conf,
# ADR-0007) com TLS na ingestão gRPC, como em produção. O certificado é de teste e é gerado
# pelo condutor a cada execução (ADR-0012).
worker_processes 1;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream central_grpc {
    zone central_grpc 64k;
    server backend:3334 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  access_log off;

  server {
    listen 3334 ssl;
    http2 on;
    ssl_certificate /certs/servidor.crt;
    ssl_certificate_key /certs/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location / {
      grpc_pass grpc://central_grpc;
      grpc_set_header X-Forwarded-For $remote_addr;
      grpc_read_timeout 60s;
      grpc_next_upstream error timeout http_502 http_503;
    }
  }
}
