# CI do próprio monitor-platform: valida os workflows partilhados, a configuração
# de lint e compila o relatório (o PDF fica como artefacto de cada execução).
name: self-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: Validar workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # só instala ferramentas; não há go.mod na raiz
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint

  lint-config:
    name: Validar configuração do golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # só instala ferramentas; não há go.mod na raiz
      - run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint config verify --config lint/.golangci.yml

  codemetrics:
    name: tools/codemetrics (vet, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/codemetrics
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/codemetrics/go.mod
          cache: false # sem dependências externas (não há go.sum)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: tools/codemetrics
          args: --config=../../lint/.golangci.yml

  report:
    name: Compilar relatório (LaTeX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@4.1.0
        with:
          working_directory: report
          root_file: main.tex
          latexmk_use_lualatex: false
      - uses: actions/upload-artifact@v7
        with:
          name: relatorio-ads
          path: report/main.pdf
